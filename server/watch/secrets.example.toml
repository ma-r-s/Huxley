# huxley-watch secrets. Copy to ~/.config/huxley-watch/secrets.toml and
# `chmod 600` it: any other mode and the watcher refuses to read it (and
# says so in its log). Each piece is optional; without it that piece is off.

# A bot from @BotFather, and the chat it writes to (message the bot once,
# then read the chat id from https://api.telegram.org/bot<token>/getUpdates).
# telegram_bot_token = "123456:ABC..."
# telegram_chat_id = "123456789"

# The dead-man check: pinged every cycle; healthchecks.io alerts when the
# pings stop (the box, its power or its internet died).
# healthchecks_url = "https://hc-ping.com/your-check-uuid"
