# huxley-watch secrets. Copy to ~/.config/huxley-watch/secrets.toml and
# `chmod 600` it: any other mode and the watcher refuses to read it (and
# says so in its log). Each piece is optional; without it that piece is off.

# Phone push through ntfy (free app, no account): a long random topic name
# that only you know (anyone who knows it can read the alerts). Subscribe
# to it in the ntfy app. Wins over Telegram when both are set; the server
# is watch.ntfy_server in watch.toml (default https://ntfy.sh).
# ntfy_topic = "huxley-<long random string>"

# A bot from @BotFather, and the chat it writes to (message the bot once,
# then read the chat id from https://api.telegram.org/bot<token>/getUpdates).
# telegram_bot_token = "123456:ABC..."
# telegram_chat_id = "123456789"

# The dead-man check: pinged every cycle; healthchecks.io alerts when the
# pings stop (the box, its power or its internet died).
# healthchecks_url = "https://hc-ping.com/your-check-uuid"

# OpenAI's Admin API, read once an hour: what was billed each day and the
# monthly spend limit. An admin key from platform.openai.com, Organization
# settings > Admin keys (read-only is enough). Without it, spend is the
# server's estimate and the limit is openai.monthly_limit_usd in watch.toml.
# Never logged or shown.
# openai_admin_key = "sk-admin-..."
