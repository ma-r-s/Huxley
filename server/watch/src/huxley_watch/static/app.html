<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walkie</title>
<meta name="theme-color" content="#fbf9f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171a21" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Walkie">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<!--
  The phone app: his conversations with the walkie, and how he uses it.
  One file, no build step, nothing from the internet (it runs on the
  tailnet). Four tabs:
  - Chat: the day as a conversation from ../chat/YYYY-MM-DD.json (chat.py),
    him on the right, the walkie on the left, what it did as chips, music,
    radio and calls between them. Opens on the latest message and follows
    today live (every 5 s while on screen). Fetched each time, never kept
    on the phone.
  - Summary and Books: what ../app.json says (app.py).
  - Walkie: the device's health from ../status.json, and the full page.
  Colours: "Ink & paper" (Mario's pick, 2026-10-17), light and dark.
-->
<style>
:root{color-scheme:light;
  --bg:#f6f3ec;--head:#fbf9f4;--line:#e7e1d4;--ink:#1d1f24;--ink2:#4c4a44;--mute:#7b766b;
  --him:#1f2a44;--him-ink:#f4f1ea;--him-play:#f4f1ea;--him-play-ink:#1f2a44;
  --dev:#ffffff;--dev-ink:#1d1f24;--dev-edge:#ece6da;--dev-play:#f1ece2;--dev-play-ink:#1f2a44;
  --accent:#c4692c;--chip:#f5e6d8;--chip-ink:#9a4f1e;--sys:#ede8dd;--sys-ic:#fbf9f4;
  --card:#fffdf8;--ok:#3a9d5d;--warn:#c98a12;--warn-bg:#f8ecd2;--bad:#c2412b;--grid:#e9e3d6;--usual:#d9e0ec}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#12141a;--head:#171a21;--line:#262a33;--ink:#ece8df;--ink2:#c2bdb1;--mute:#958f83;
  --him:#33436b;--him-ink:#f4f1ea;--him-play:#f4f1ea;--him-play-ink:#26324f;
  --dev:#1d2028;--dev-ink:#ece8df;--dev-edge:#2a2e38;--dev-play:#2a2e38;--dev-play-ink:#e9dcc6;
  --accent:#e08a4f;--chip:#33261c;--chip-ink:#f0b07e;--sys:#1b1e25;--sys-ic:#262a33;
  --card:#1a1d24;--ok:#4cc277;--warn:#e0a63a;--warn-bg:#3a2f18;--bad:#f07b62;--grid:#2a2e38;--usual:#2c3954}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.38 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior-y:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.ico{width:18px;height:18px;flex:none;display:block}

/* --- header: who, online, battery --- */
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:11px;background:var(--head);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 11px calc(16px + env(safe-area-inset-left))}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;background:var(--him);color:var(--him-ink)}
.who{flex:1;min-width:0}
.who b{display:block;font-size:17px;letter-spacing:-.01em}
.who small{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--ok)}
.bat{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.bat.low{color:var(--bad);font-weight:650}
.bat .ico{width:20px;height:20px}
main{max-width:640px;margin:0 auto;padding:0 calc(12px + env(safe-area-inset-right)) calc(92px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}

/* --- chat --- */
.day{display:flex;justify-content:center;margin:16px 0 8px}
.day span{font-size:12px;font-weight:650;letter-spacing:.02em;color:var(--mute);background:var(--sys);padding:4px 12px;border-radius:10px}
.earlier{display:flex;justify-content:center;margin:14px 0 2px}
.earlier a{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--accent);padding:7px 14px 7px 10px;border-radius:999px;background:var(--chip)}
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.turn{display:flex;flex-direction:column;gap:5px;margin-top:6px;border-radius:22px;transition:background .3s}
.turn.near{background:var(--warn-bg);padding:6px;margin:4px -6px}
.turn.test{opacity:.5}
.b{max-width:82%;padding:9px 12px 7px;border-radius:20px;overflow-wrap:anywhere}
.b p{margin:0 0 6px}
.b p:last-child{margin-bottom:0}
.him{align-self:flex-end;background:var(--him);color:var(--him-ink);border-bottom-right-radius:6px}
.dev{align-self:flex-start;background:var(--dev);color:var(--dev-ink);border-bottom-left-radius:6px;box-shadow:0 0 0 1px var(--dev-edge)}
.him.warn{box-shadow:inset 0 0 0 2px var(--warn)}
.flag{display:block;font-size:12px;font-weight:650;color:var(--warn);margin-bottom:3px}
.him .flag{color:#f2c46b}
.quiet{opacity:.75;font-style:italic}
.meta{display:block;font-size:11.5px;opacity:.6;text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.own{align-self:flex-start;font-size:12px;color:var(--mute);margin:2px 0 -2px 4px}
.act{align-self:flex-start;display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 -1px 2px;max-width:92%}
.act span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:550;color:var(--chip-ink);background:var(--chip);padding:4px 11px 4px 8px;border-radius:999px;overflow-wrap:anywhere}
.act .ico{width:15px;height:15px}
.clip{appearance:none;border:0;background:none;padding:0;margin:2px 0 0;display:flex;align-items:center;gap:9px;width:100%;min-width:170px;cursor:pointer;text-align:left}
.play{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center}
.play .ico{width:14px;height:14px}
.play .i-pause,.clip.on .play .i-play{display:none}.clip.on .play .i-pause{display:block}
.him .play{background:var(--him-play);color:var(--him-play-ink)}
.dev .play,.sys .play{background:var(--dev-play);color:var(--dev-play-ink)}
.track{flex:1;height:4px;border-radius:2px;background:currentColor;opacity:.22;position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;width:0;background:currentColor;opacity:1;border-radius:2px}
.clip.on .track{opacity:.5}
.dur{font-size:12px;font-variant-numeric:tabular-nums;opacity:.75;white-space:nowrap}
.tm{font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.55;white-space:nowrap;margin-left:2px}
.tail{display:flex;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mute);margin:14px 0 4px}
.sys{align-self:center;max-width:92%;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);background:var(--sys);padding:7px 14px 7px 8px;border-radius:14px;margin:10px 0}
.sys .ic{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--sys-ic);color:var(--accent)}
.sys .ic .ico{width:15px;height:15px}
.sys b{color:var(--ink);font-weight:650}
.sys .now{color:var(--accent);font-weight:650}
.sys .calls{display:flex;flex-direction:column;gap:6px;margin-top:6px;color:var(--ink2)}
.sys .calls .clip{min-width:200px}
.sys .calls .who{font-size:12px;font-weight:600;min-width:46px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.float{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;
  appearance:none;border:0;cursor:pointer;font-size:13px;font-weight:650;padding:8px 14px;border-radius:999px;
  background:var(--him);color:var(--him-ink);box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;align-items:center;gap:7px}
.float[hidden]{display:none}
.float .dot{margin:0}
.float.new{background:var(--accent);color:#fff}

/* --- cards (summary, books, walkie) --- */
h2.sec{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:22px 4px 8px}
.card{display:block;background:var(--card);border-radius:18px;box-shadow:0 0 0 1px var(--line);padding:16px;margin:0 0 10px}
.lab{font-size:13px;font-weight:650;color:var(--ink2)}
.row{display:flex;align-items:baseline;gap:10px}.row .val{margin-left:auto;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.big .of{font-size:20px;font-weight:560;color:var(--ink2);letter-spacing:0}
.sub{font-size:14px;color:var(--ink2);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;min-width:0}
.mute{color:var(--mute)}
.fig{font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.said{color:var(--ink);overflow-wrap:anywhere;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sys);color:var(--ink2);display:inline-flex;gap:6px;align-items:center;max-width:100%}
.chip.warn{background:var(--warn-bg);color:var(--ink)}
.hatch,.chip.off{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--mute) 28%,transparent) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mute) 40%,transparent)}
.range{position:relative;height:26px;margin:16px 0 4px;border-radius:8px;background:var(--grid)}
.range .usual{position:absolute;top:0;bottom:0;background:var(--usual);border-radius:8px;display:block}
.range .mark{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;border-radius:2px;background:var(--him);display:block}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
b.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none;align-self:center}
b.sw.usual{background:var(--usual)}b.sw.mk{width:4px;background:var(--him)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dots{display:flex;gap:5px;margin:16px 0 2px;flex-wrap:wrap}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--grid);display:block}.dots i.on{background:var(--him)}
.line{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 0}
.line+.line{border-top:1px solid var(--grid)}
.ini{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:650;background:var(--chip);color:var(--chip-ink)}
.line .name{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .when{text-align:right;font-size:14px;color:var(--ink2);white-space:nowrap}.line .when small{display:block;font-size:12px;color:var(--mute)}
.line>.ico:last-child{color:var(--mute)}
.kind{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--chip);color:var(--chip-ink)}
.kind .ico{width:20px;height:20px}
.mt{flex:1;min-width:0}
.mt .title{font-size:17px;font-weight:620;overflow-wrap:anywhere}
.mt .k{font-size:12px;color:var(--mute)}
.mt .sub{margin-top:2px}
.state{font-size:13px;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.prog{height:6px;border-radius:3px;background:var(--grid);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.str{display:block;padding:10px 0;min-height:48px}
.str+.str{border-top:1px solid var(--grid)}
.str .top{display:flex;gap:10px;align-items:baseline;min-width:0}
.str .at{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;flex:none;width:44px}
.str .what{flex:1;min-width:0;overflow-wrap:anywhere}
.str .chips{margin:6px 0 0 54px}
.str .chip{font-size:12px;padding:3px 9px}
.more{appearance:none;border:0;font-size:15px;background:var(--sys);border-radius:12px;width:100%;min-height:44px;margin-top:8px;cursor:pointer}
.dayrow .dl{font-weight:600;white-space:nowrap}
.dayrow .tags{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap}
.dayrow .tag{font-size:12px;padding:2px 8px;border-radius:999px;color:var(--ink2);font-style:normal;white-space:nowrap;background:var(--sys)}
.dayrow .cnt{text-align:right;font-variant-numeric:tabular-nums}.dayrow .cnt b{font-size:20px;font-weight:650}
.dayrow .cnt small{display:block;font-size:12px;color:var(--mute);white-space:nowrap}
.chart{position:relative;height:170px;margin-top:22px}
.chart .cband{position:absolute;left:-3px;right:-3px;background:var(--usual);display:block}
.chart .cols{position:absolute;inset:0;display:flex;gap:6px;align-items:flex-end}
.chart .col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.chart .bar{position:relative;width:70%;max-width:38px;border-radius:6px 6px 2px 2px;background:color-mix(in srgb,var(--him) 55%,var(--bg));min-height:2px}
.chart .col.today .bar{background:var(--him)}
.chart .v{position:relative;font-size:11px;color:var(--ink2);margin-bottom:4px;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:center;line-height:1.15}
.chart .v small{display:block;font-size:10px;color:var(--mute)}
.chart .off,.chart .nolog{width:86%;height:100%;border-radius:6px;display:flex;align-items:center;justify-content:center}
.chart .off span,.chart .nolog span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;color:var(--ink2);white-space:nowrap}
.chart .nolog{border:1.5px dashed var(--grid)}.chart .nolog span{color:var(--mute)}
.xl{display:flex;gap:6px;margin-top:8px}
.xl div{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--ink2);line-height:1.2;white-space:nowrap}
.xl small{display:block;color:var(--mute);font-size:11px}
.chip.liked{background:var(--chip);color:var(--chip-ink)}
.chip.nope{text-decoration:line-through;color:var(--mute)}
details.cat{border-top:1px solid var(--grid)}
details.cat:first-of-type{border-top:0}
details.cat>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 64px 44px 18px;align-items:center;gap:10px;min-height:48px}
details.cat>summary::-webkit-details-marker{display:none}
details.cat .cn{font-size:15px;font-weight:600;overflow-wrap:anywhere}
details.cat .cb{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
details.cat .cb i{display:block;height:100%;background:var(--accent);border-radius:4px}
details.cat .cc{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink2)}
details.cat>summary .ico{color:var(--mute);transition:transform .15s}
details.cat[open]>summary .ico{transform:rotate(90deg)}
details.cat ul{margin:0 0 10px;padding:0;list-style:none}
details.cat li{font-size:15px;padding:5px 0;overflow-wrap:anywhere}
details.cat li small{color:var(--mute);font-size:13px}
.health{display:flex;align-items:center;gap:12px}
.health .big{margin:0;font-size:30px}
.health .ring{width:14px;height:14px;border-radius:50%;flex:none;background:var(--ok);box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 22%,transparent)}
.health .ring.warn{background:var(--warn);box-shadow:0 0 0 5px color-mix(in srgb,var(--warn) 22%,transparent)}
.health .ring.crit{background:var(--bad);box-shadow:0 0 0 5px color-mix(in srgb,var(--bad) 22%,transparent)}
.need{display:flex;align-items:center;gap:12px}
.need .mt .title{font-size:16px}
.need .big{font-size:24px;margin:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles .card{margin:0}
.tiles .big{font-size:26px}
.full{display:flex;align-items:center;gap:10px;font-weight:600}
.full .ico:last-child{margin-left:auto;color:var(--mute)}
.ptr{height:0;overflow:hidden;display:grid;place-items:center;transition:height .15s}
.ptr i{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--grid);border-top-color:var(--ink2);display:block}
.ptr.ready i{border-top-color:var(--ink)}
.ptr.busy i{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* --- tabs --- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:color-mix(in srgb,var(--head) 94%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.tabs a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute)}
nav.tabs a .ico{width:24px;height:24px}
nav.tabs a.on{color:var(--accent)}
</style>
</head>
<body>
<!--SPRITE-->
<header class="top">
  <span class="av" aria-hidden="true">A</span>
  <span class="who"><b id="title">Abuelo</b><small id="state">&nbsp;</small></span>
  <span id="bat" class="bat"></span>
</header>
<div id="ptr" class="ptr" aria-hidden="true"><i></i></div>
<main id="view"></main>
<button id="float" class="float" type="button" hidden></button>
<nav class="tabs">
  <a href="#chat" data-tab="chat"><svg class="ico" aria-hidden="true"><use href="#i-chat"/></svg>Chat</a>
  <a href="#summary" data-tab="summary"><svg class="ico" aria-hidden="true"><use href="#i-chart"/></svg>Summary</a>
  <a href="#books" data-tab="books"><svg class="ico" aria-hidden="true"><use href="#i-book"/></svg>Books</a>
  <a href="#walkie" data-tab="walkie"><svg class="ico" aria-hidden="true"><use href="#i-walkie"/></svg>Walkie</a>
</nav>
<script>
"use strict";
const view = document.getElementById("view");
const float = document.getElementById("float");
const ptr = document.getElementById("ptr");
const REASON = {tool_error: "something failed", not_heard: "not heard", no_answer: "no answer", corrected: "he corrected it", asked_again: "asked again"};
const KIND = {music: "Artist", book: "Book", radio: "Station"};
const CHAT_POLL_MS = 5000;
let app = null, appFailed = false, status = null;
let chat = null, chatFor = null, chatFailed = false, chatToken = 0;
let newBelow = false, allStruggles = false;
const openCats = new Set();

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function ic(name, cls) { return `<svg class="ico${cls ? " " + cls : ""}" aria-hidden="true"><use href="#i-${name}"/></svg>`; }
function mins(m) { if (m == null) return ""; return m < 60 ? `${Math.round(m)} min` : `${(m / 60).toFixed(1)} h`; }
function span(lo, hi) {
  if (lo >= 60) return `${(lo / 60).toFixed(1)}-${(hi / 60).toFixed(1)} h`;
  return hi < 60 ? `${Math.round(lo)}-${Math.round(hi)} min` : `${mins(lo)}-${mins(hi)}`;
}
function clock(s) { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function ago(iso) {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 90) return "just now";
  const m = s / 60;
  if (m < 60) return `${Math.round(m)} min ago`;
  const h = m / 60;
  return h < 36 ? `${Math.round(h)} h ago` : `${Math.round(h / 24)} d ago`;
}
function length(sec) { return sec == null ? "" : sec < 60 ? `${sec} s` : mins(sec / 60); }
function talked(p) {
  const verb = p.talked ? "talked" : "called", n = p.days_ago;
  return n === 0 ? `${verb} today` : n === 1 ? `${verb} yesterday` : `${verb} ${n} d ago`;
}
function dayName(date, label, today) {
  today = today || (app && app.today && app.today.date);
  if (date === today) return "Today";
  if (today && Date.parse(today) - Date.parse(date) === 86400000) return "Yesterday";
  return label || date;
}
function atBottom() { return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 80; }
function toBottom() { window.scrollTo(0, document.documentElement.scrollHeight); }

/* --- the header: who, online, what's playing, battery (from app.json) --- */
function header() {
  const st = document.getElementById("state"), bat = document.getElementById("bat");
  if (!app || !app.today) { st.innerHTML = appFailed ? "not reachable" : "&nbsp;"; bat.innerHTML = ""; return; }
  const dev = app.today.device, en = app.today.enjoying;
  const parts = [];
  if (dev.online) parts.push(`<span class="dot on"></span>online`);
  else if (dev.online === false) parts.push(`<span class="dot"></span>offline${dev.since ? " since " + esc(dev.since) : ""}`);
  else parts.push(`<span class="dot"></span>not seen yet`);

}

/* --- chat --- */
function clipButton(clips, extra, at) {
  if (!clips || !clips.length) return "";
  const ms = clips.reduce((n, c) => n + (c.ms || 0), 0);
  const srcs = esc(JSON.stringify(clips.map(c => [c.audio, c.ms || 0])));
  const dur = ms ? clock(Math.max(1, ms / 1000)) : "";
  const tm = at ? `<span class="tm">${esc(at)}</span>` : "";
  return `<button class="clip" type="button" data-clips="${srcs}" data-ms="${ms}">${extra || ""}<span class="play">${ic("play", "i-play")}${ic("pause", "i-pause")}</span><span class="track"><i></i></span><span class="dur">${dur}</span>${tm}</button>`;
}
/* A side's recording with its time on the same row; just the time without one. */
function foot(clips, at) {
  return clips && clips.length ? clipButton(clips, "", at) : `<span class="meta">${esc(at)}</span>`;
}
function eventHTML(it) {
  const icon = {music: "music", book: "book", radio: "radio", call: "phone"}[it.kind] || "music";
  let line;
  if (it.kind === "call") {
    line = `<b>Call with ${esc(it.title)}</b> &middot; ${esc(it.at)}${it.live ? ` &middot; <span class="now">on the line</span>` : it.seconds != null ? ` &middot; ${length(it.seconds)}` : ""}`;
  } else if (it.live) {
    line = `<b>${esc(it.title || it.kind)}</b> &middot; since ${esc(it.at)} &middot; <span class="now">playing</span>`;
  } else {
    line = `<b>${esc(it.title || it.kind)}</b> &middot; ${esc(it.at)} to ${esc(it.end || "?")}${it.seconds != null ? " &middot; " + length(it.seconds) : ""}`;
  }
  const calls = it.clips && it.clips.length
    ? `<div class="calls">${it.clips.map(c => clipButton([c], `<span class="who">${esc(c.who === "Him" ? "Abuelo" : c.who)}</span>`)).join("")}</div>` : "";
  return `<div class="sys${it.bench ? " test" : ""}" data-id="${esc(it.id)}" data-t="${it.t}"><span class="ic">${ic(icon)}</span><span>${line}${calls}</span></div>`;
}
function turnHTML(it) {
  let h = `<div class="turn${it.bench ? " test" : ""}" data-id="${esc(it.id)}" data-t="${it.t}">`;
  if (it.him) {
    const flag = !it.heard ? `<span class="flag">Didn't catch it</span>` : "";
    const words = it.him.text ? `<p>${esc(it.him.text)}</p>`
      : `<p class="quiet">${it.pending ? "Writing down his words&hellip;" : it.heard ? "His words weren't transcribed" : "No words came through"}</p>`;
    h += `<div class="b him${it.heard ? "" : " warn"}">${flag}${words}${foot(it.him.clips, it.bench ? `${it.at} · test` : it.at)}</div>`;
  } else if (it.walkie) {
    h += `<span class="own">The walkie, on its own</span>`;
  }
  if (it.actions.length) {
    h += `<div class="act">${it.actions.map(a => `<span>${ic(a.icon)}${esc(a.label)}</span>`).join("")}</div>`;
  }
  if (it.walkie) {
    const words = it.walkie.text ? `<p>${esc(it.walkie.text)}</p>` : "";
    h += `<div class="b dev">${words}${foot(it.walkie.clips, it.at)}</div>`;
  }
  return h + `</div>`;
}
function itemHTML(it) { return it.type === "event" ? eventHTML(it) : turnHTML(it); }

function chatShell(body) {
  const earlier = body.prev ? `<div class="earlier"><a href="#chat/${esc(body.prev)}">${ic("prev")}${esc(dayName(body.prev, body.prev_label, body.today))}</a></div>` : "";
  const tail = body.is_today ? `<div class="tail" id="tail"></div>` : "";
  return `${earlier}<div class="day"><span>${esc(dayName(body.date, body.label, body.today))}</span></div><div class="msgs" id="msgs"></div>${tail}`;
}
/* Keyed: a message already drawn and unchanged is left alone (so a clip
   playing keeps playing); a changed one (his words arriving late, a song
   ending) is redrawn in place; new ones are added at the end. */
function drawItems(items) {
  const box = document.getElementById("msgs");
  if (!box) return 0;
  if (!items.length) { box.innerHTML = `<div class="empty">Nothing said yet</div>`; return 0; }
  const empty = box.querySelector(".empty");
  if (empty) empty.remove();
  const have = new Map();
  for (const el of [...box.children]) {
    if (have.has(el.dataset.id)) el.remove();  // never two of one message
    else have.set(el.dataset.id, el);
  }
  let added = 0, prev = null;
  for (const it of items) {
    const html = itemHTML(it);
    let el = have.get(it.id);
    if (!el) {
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      el = tmp.firstElementChild;
      el.dataset.html = html;
      if (prev) prev.after(el); else box.prepend(el);
      added++;
    } else if (el.dataset.html !== html && !el.querySelector(".clip.on")) {
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      const fresh = tmp.firstElementChild;
      fresh.dataset.html = html;
      if (el.classList.contains("near")) fresh.classList.add("near");
      el.replaceWith(fresh);
      el = fresh;
      added++;
    }
    have.delete(it.id);
    prev = el;
  }
  for (const el of have.values()) {
    if (playing && el.contains(playing)) stop();
    el.remove();
  }
  return added;
}
function tailLine() {
  const t = document.getElementById("tail");
  if (t) t.innerHTML = chatFailed ? `<span class="dot"></span>Not reachable, trying again` : `<span class="dot on"></span>Live: new messages appear here`;
}
function floatButton() {
  tailLine();
  const r = route();
  if (r.tab !== "chat") { float.hidden = true; return; }
  const today = app && app.today && app.today.date;
  if (r.date && r.date !== today) {
    float.hidden = false;
    float.className = "float";
    float.innerHTML = `Back to today`;
    return;
  }
  if (newBelow) {
    float.hidden = false;
    float.className = "float new";
    float.innerHTML = `New messages ${ic("next")}`;
    return;
  }
  float.hidden = atBottom();
  float.className = "float";
  float.innerHTML = chatFailed ? `<span class="dot"></span>Not reachable` : `<span class="dot on"></span>Live`;
}
async function loadChat(first) {
  const r = route();
  const date = r.date || "today";
  const token = ++chatToken;
  let body;
  try {
    const res = await fetch(`../chat/${encodeURIComponent(date)}.json`, {cache: "no-store"});
    if (!res.ok) throw new Error(String(res.status));
    body = await res.json();
    chatFailed = false;
  } catch (e) {
    chatFailed = true;
    if (token === chatToken && first) view.innerHTML = `<div class="empty">The walkie's page isn't reachable</div>`;
    floatButton();
    return;
  }
  if (token !== chatToken || route().tab !== "chat") return;
  const stay = !first && !atBottom();  // read before drawing: drawing makes the page longer
  if (first || chatFor !== body.date) {
    view.innerHTML = chatShell(body);
    chatFor = body.date;
  }
  chat = body;
  const changed = drawItems(body.items);  // new messages, or words and answers landing in one
  if (first) {
    if (r.at != null) mark(r.at); else toBottom();
  } else if (changed && stay) {
    newBelow = true;
  } else if (changed) {
    toBottom();
  }
  floatButton();
}
function mark(t) {
  const els = [...document.querySelectorAll("#msgs [data-t]")];
  if (!els.length) return;
  let best = els[0];
  for (const el of els) if (Math.abs(+el.dataset.t - t) < Math.abs(+best.dataset.t - t)) best = el;
  if (best.classList.contains("turn")) best.classList.add("near");
  best.scrollIntoView({block: "center"});
}

/* One player for every recording: a side with several clips plays them in turn. */
const player = new Audio();
let playing = null, queue = [], done = 0;
function stop() {
  player.pause();
  if (playing) { playing.classList.remove("on"); playing.querySelector(".track i").style.width = "0"; }
  playing = null; queue = []; done = 0;
}
function next() {
  if (!queue.length) { stop(); return; }
  const [src] = queue.shift();
  player.src = src;
  player.play().catch(() => stop());
}
player.addEventListener("ended", () => {
  if (!playing) return;
  done += player.duration ? player.duration * 1000 : 0;
  next();
});
player.addEventListener("timeupdate", () => {
  if (!playing) return;
  const total = +playing.dataset.ms || (player.duration * 1000) || 1;
  const pct = Math.min(100, (done + player.currentTime * 1000) / total * 100);
  playing.querySelector(".track i").style.width = `${pct}%`;
});
view.addEventListener("click", e => {
  const btn = e.target.closest(".clip");
  if (!btn) return;
  if (btn === playing) { stop(); return; }
  stop();
  playing = btn;
  btn.classList.add("on");
  queue = JSON.parse(btn.dataset.clips).map(([a, ms]) => [`../${a}`, ms]);
  next();
});
float.addEventListener("click", () => {
  const r = route();
  const today = app && app.today && app.today.date;
  if (r.date && r.date !== today) { location.hash = "#chat"; return; }
  newBelow = false;
  toBottom();
  floatButton();
});
window.addEventListener("scroll", () => {
  if (route().tab !== "chat") return;
  if (newBelow && atBottom()) newBelow = false;
  floatButton();
}, {passive: true});

/* --- summary --- */
function chapter(c) {
  if (c.chapter_index && c.chapters) {
    const pct = Math.min(100, c.chapter_index / c.chapters * 100).toFixed(1);
    return `<div class="prog"><i style="width:${pct}%"></i></div><div class="sub"><span>${c.chapter ? `${esc(c.chapter)} &middot; ` : ""}<span class="fig">${c.chapter_index} of ${c.chapters}</span></span></div>`;
  }
  if (c.chapter) return `<div class="sub"><span>${esc(c.chapter)}</span>${c.chapters ? `<span class="fig">${c.chapters} ch.</span>` : ""}</div>`;
  return c.chapters ? `<div class="sub"><span class="fig">${c.chapters} ch.</span></div>` : "";
}
function summary(d) {
  const t = d.today, dev = t.device, u = t.used, lu = t.last_used, en = t.enjoying, tk = d.talks;
  let h = `<h2 class="sec">Today</h2><section class="card"><div class="lab">Last used</div>`;
  if (lu) {
    const what = lu.said ? `<span class="said">&ldquo;${esc(lu.said)}&rdquo;</span>`
      : lu.tool ? `<span class="said">${esc(lu.tool)}${lu.query ? " &middot; " + esc(lu.query) : ""}</span>`
      : !lu.heard ? `<span class="said mute">not heard</span>` : "";
    h += `<div class="big" data-ago="${esc(lu.at)}">${ago(lu.at)}</div><div class="sub"><span class="fig">${esc(lu.clock)}</span>${what}</div>`;
  } else {
    h += `<div class="big mute">none yet</div>`;
  }
  if (dev.online === false) h += `<div class="chips"><span class="chip off">walkie offline${dev.since ? " since " + esc(dev.since) : ""}</span></div>`;
  h += `</section>`;

  h += `<section class="card"><div class="row"><div class="lab">Used today</div><div class="val">${mins(u.minutes)}</div></div>`;
  if (u.offline_pct != null) h += `<div class="chips"><span class="chip off">walkie offline ${u.offline_pct}% of the day so far</span></div>`;
  if (u.state === "range") {
    const max = Math.max(u.hi * 1.6, u.minutes * 1.15, 10);
    const p = v => (Math.min(v, max) / max * 100).toFixed(1);
    h += `<div class="range"><i class="usual" style="left:${p(u.lo)}%;width:${(p(u.hi) - p(u.lo)).toFixed(1)}%"></i><b class="mark" style="left:${p(u.minutes)}%"></b></div>`;
    h += `<div class="scale"><span>0</span><span>${mins(max)}</span></div>`;
    h += `<div class="legend"><span><b class="sw mk"></b>today</span><span><b class="sw usual"></b>his usual by ${esc(u.by)}: ${span(u.lo, u.hi)}</span></div>`;
  } else {
    let dots = "";
    for (let k = 0; k < u.needed; k++) dots += `<i class="${k < u.days ? "on" : ""}"></i>`;
    h += `<div class="dots" aria-hidden="true">${dots}</div><div class="sub">Learning his routine &middot; day ${u.learning_day} of ${u.needed}</div>`;
  }
  h += `</section>`;

  const list = tk.struggles;
  h += `<section class="card"><div class="row"><div class="lab">Struggles today</div><div class="val">${list.length} <span class="mute" style="font-size:15px;font-weight:500">of ${tk.requests_today}</span></div></div>`;
  const shown = list.slice().reverse().slice(0, allStruggles ? list.length : 5);
  for (const s of shown) {
    const what = s.said ? `<span class="what">&ldquo;${esc(s.said)}&rdquo;</span>`
      : s.tool ? `<span class="what">${esc(s.tool)}${s.query ? " &middot; " + esc(s.query) : ""}</span>`
      : `<span class="what mute">no words</span>`;
    h += `<a class="str" href="#chat/${esc(t.date)}@${s.t}"><div class="top"><span class="at">${esc(s.at)}</span>${what}</div><div class="chips">${s.reasons.map(r => `<span class="chip warn">${REASON[r] || esc(r)}</span>`).join("")}</div></a>`;
  }
  if (shown.length < list.length) h += `<button class="more" type="button" id="more">show all ${list.length}</button>`;
  h += `</section>`;

  h += `<section class="card"><div class="lab">${en && en.playing ? "Playing now" : "Last played"}</div>`;
  if (en) {
    const state = en.playing ? `<span class="dot on"></span>playing` : `ended ${esc(en.until)}`;
    h += `<div class="line"><span class="kind">${ic(en.kind)}</span><div class="mt"><div class="title">${esc(en.title)}</div>${en.by ? `<div class="sub"><span>${esc(en.by)}</span></div>` : ""}</div><span class="state">${state}</span></div>`;
    if (en.kind === "book") h += chapter(en);
  } else {
    h += `<div class="sub mute">nothing yet</div>`;
  }
  h += `</section>`;

  h += `<h2 class="sec">People</h2><section class="card">`;
  if (!t.people.length) h += `<div class="sub mute">no calls yet</div>`;
  for (const p of t.people) {
    h += `<div class="line"><span class="ini">${esc(p.name.charAt(0))}</span><span class="name">${esc(p.name)}</span><span class="when">${talked(p)}<small>${esc(p.clock)} &middot; ${length(Math.round(p.minutes * 60))}</small></span></div>`;
  }
  h += `</section>`;

  const tr = d.trends, days = tr.days, usual = tr.usual_day, fav = tr.favourites, fu = tr.first_use;
  const drawn = days.filter(x => x.logs === "full" && !x.offline);
  const top = Math.max(30, usual ? usual.hi * 1.15 : 0, ...drawn.map(x => x.minutes * 1.15));
  const y = v => Math.min(100, v / top * 100).toFixed(1);
  const band = usual ? `<i class="cband" style="bottom:${y(usual.lo)}%;height:${(y(usual.hi) - y(usual.lo)).toFixed(1)}%"></i>` : "";
  let cols = "", xl = "";
  for (const x of days) {

    else if (x.logs === "partial") body = `<div class="nolog"><span>logs begin</span></div>`;
    else if (x.offline) body = `<div class="off hatch"><span>walkie offline</span></div>`;
    else if (x.today) body = `<span class="v">${mins(x.minutes)}<small>so far</small></span><i class="bar" style="height:${y(x.minutes)}%"></i>`;
    else body = `${band}<span class="v">${mins(x.minutes)}</span><i class="bar" style="height:${y(x.minutes)}%"></i>`;
    cols += `<div class="col${x.today ? " today" : ""}">${body}</div>`;
    const [wd, dn] = x.label.split(" ");
    xl += `<div>${x.today ? "Today" : esc(wd)}<small>${esc(dn)}</small></div>`;
  }
  h += `<h2 class="sec">This week</h2><section class="card"><div class="lab">Time he used it</div><div class="chart"><div class="cols">${cols}</div></div><div class="xl">${xl}</div>`;
  h += usual ? `<div class="legend"><span><b class="sw usual"></b>his usual day: ${span(usual.lo, usual.hi)}</span></div>`
    : `<div class="legend"><span>Learning his routine &middot; day ${u.learning_day} of ${u.needed}</span></div>`;
  h += `</section>`;

  h += `<section class="card"><div class="lab">Favourites &middot; ${fav.days} days</div>`;
  for (const [kind, f] of [["music", fav.artist], ["book", fav.book], ["radio", fav.station]]) {
    h += `<div class="line"><span class="kind">${ic(kind)}</span><div class="mt"><div class="k">${KIND[kind]}</div>`;
    h += f ? `<div class="title">${esc(f.name)}</div>${kind === "book" ? chapter(f) : ""}</div><span class="fig">${mins(f.minutes)}</span>`
      : `<div class="title mute">none yet</div></div>`;
    h += `</div>`;
  }
  h += `</section>`;
  h += `<section class="card"><div class="lab">Usually first uses it at</div>`;
  h += fu.clock ? `<div class="big">${esc(fu.clock)}</div><div class="sub">median of ${fu.days} days</div>`
    : `<div class="big mute">not yet</div><div class="sub">${fu.days} of ${fu.needed} days</div>`;
  h += `</section>`;

  h += `<h2 class="sec">Conversations</h2><section class="card">`;
  for (const x of tk.days) {
    const tags = (x.offline ? `<i class="tag hatch">walkie offline</i>` : "")
      + (x.logs === "partial" ? `<i class="tag">logs begin</i>` : "")
      + (x.battery_min != null && x.battery_min < t.device.battery_low_pct ? `<i class="tag">battery ${x.battery_min}%</i>` : "");
    const str = x.struggles ? `<small>${x.struggles} struggle${x.struggles === 1 ? "" : "s"}</small>` : "";
    h += `<a class="line dayrow" href="#chat/${esc(x.date)}"><span class="dl">${esc(dayName(x.date, x.label))}</span><span class="tags">${tags}</span><span class="cnt"><b>${x.requests}</b>${str}</span>${ic("next")}</a>`;
  }
  h += `</section>`;
  return h;
}

/* --- books --- */
function books(d) {
  const b = d.books || {reading: [], finished: [], dropped: [], shelf: null};
  let h = `<h2 class="sec">Reading now</h2><section class="card">`;
  if (!b.reading.length) h += `<div class="sub mute">nothing started yet</div>`;
  for (const r of b.reading) {
    const bar = r.pct != null ? `<div class="prog"><i style="width:${Math.min(100, r.pct)}%"></i></div>` : "";
    const ch = r.chapter != null && r.chapters ? `<span class="fig">ch ${r.chapter} of ${r.chapters}</span>` : "";
    const heard = r.ago ? `<span class="fig">${esc(r.ago)} ago</span>` : "";
    h += `<div class="line"><span class="kind">${ic("book")}</span><div class="mt"><div class="title">${esc(r.title)}${r.liked ? " &#9829;" : ""}</div>`
      + `<div class="sub">${r.author ? `<span>${esc(r.author)}</span>` : ""}${ch}${heard}</div>${bar}</div></div>`;
  }
  h += `</section>`;
  const chip = r => `<span class="chip${r.liked ? " liked" : r.disliked ? " nope" : ""}">${esc(r.title)}${r.liked ? " &#9829;" : ""}</span>`;
  h += `<section class="card"><div class="row"><div class="lab">Finished</div><div class="val">${b.finished.length}</div></div>`;
  h += b.finished.length ? `<div class="chips">${b.finished.map(chip).join("")}</div>` : `<div class="sub mute">none yet</div>`;
  h += `</section>`;
  if (b.dropped.length) {
    h += `<section class="card"><div class="row"><div class="lab">Left halfway</div><div class="val">${b.dropped.length}</div></div>`;
    h += `<div class="chips">${b.dropped.map(r => `<span class="chip off">${esc(r.title)}</span>`).join("")}</div><div class="sub">not offered again</div></section>`;
  }
  const sh = b.shelf;
  h += `<h2 class="sec">On the shelf</h2><section class="card">`;
  if (!sh) return h + `<div class="sub mute">no shelf yet</div></section>`;
  h += `<div class="big">${sh.left} <span class="of">of ${sh.total} left</span></div><div class="sub">what the walkie can still recommend</div><div style="margin-top:10px">`;
  for (const c of sh.categories) {
    const pct = c.total ? (c.left.length / c.total * 100).toFixed(1) : 0;
    const list = c.left.map(t => `<li>${esc(t.title)}${t.author ? ` <small>${esc(t.author)}</small>` : ""}</li>`).join("");
    h += `<details class="cat" data-cat="${esc(c.name)}"${openCats.has(c.name) ? " open" : ""}><summary><span class="cn">${esc(c.name)}</span><span class="cb"><i style="width:${pct}%"></i></span><span class="cc">${c.left.length}/${c.total}</span>${ic("next")}</summary>`
      + (list ? `<ul>${list}</ul>` : `<div class="sub mute" style="margin-bottom:10px">all heard</div>`) + `</details>`;
  }
  return h + `</div></section>`;
}

/* --- walkie: the device's health (status.json) and the full page --- */
function walkie(s) {
  if (!s) return `<div class="empty">${appFailed ? "Not reachable" : "Loading"}</div>`;
  const sev = s.status === "crit" ? "crit" : s.status === "warn" ? "warn" : "";
  let h = `<h2 class="sec">Right now</h2><section class="card health"><span class="ring ${sev}"></span><div class="mt"><div class="big">${esc(s.headline || "")}</div><div class="sub">checked ${esc(s.checked || "")}</div></div></section>`;
  for (const it of s.items || []) {
    h += `<section class="card need"><div class="mt"><div class="title">${esc(it.label)}</div><div class="chips"><span class="chip warn">${esc(it.chip)}</span></div></div><div class="big">${esc(it.big)}</div></section>`;
  }
  const t = s.tiles || {};
  const tile = (lab, big, sub) => `<section class="card"><div class="lab">${lab}</div><div class="big">${big}</div><div class="sub">${sub || "&nbsp;"}</div></section>`;
  const w = t.walkie || {}, b = t.battery || {}, wi = t.wifi || {}, sv = t.server || {}, au = t.audio || {}, oa = t.openai || {};
  h += `<h2 class="sec">The walkie</h2><div class="tiles">`;
  h += tile("Walkie", w.online ? "Online" : "Offline", w.online ? `since ${esc(w.since || "?")}` : w.last_seen ? `last seen ${esc(w.last_seen)}` : "");
  h += tile("Battery", b.pct != null ? `${b.pct}%` : "?", b.mv ? `${(b.mv / 1000).toFixed(2)} V${b.at ? " &middot; " + esc(b.at) : ""}` : "");
  h += tile("Wi-Fi", wi.rssi != null ? `${wi.rssi} dBm` : "?", wi.bars != null ? `${"&#9679;".repeat(wi.bars)}${"&#9675;".repeat(4 - wi.bars)}` : "");
  h += tile("Server", sv.running ? "Up" : "Down", `${sv.up ? esc(sv.up) : ""}${sv.firmware ? " &middot; fw " + esc(sv.firmware) : ""}`);
  h += tile("Audio gaps", au.gap_pct != null ? `${au.gap_pct}%` : "?", `last ${au.window_h || 3} h`);
  h += tile("OpenAI", oa.budget_left_usd != null ? `$${oa.budget_left_usd.toFixed(2)}` : "?", oa.days_left != null ? `left, ${Math.round(oa.days_left)} d` : "");
  h += `</div><h2 class="sec">Everything else</h2><a class="card full" href="../">${ic("chart")}The full status page${ic("next")}</a>`;
  return h;
}

/* --- frame --- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = /^chat\/(\d{4}-\d{2}-\d{2})(?:@([\d.]+))?$/.exec(h);
  if (m) return {tab: "chat", date: m[1], at: m[2] != null ? parseFloat(m[2]) : null};
  return {tab: ["chat", "summary", "books", "walkie"].includes(h) ? h : "chat"};
}
function render(first) {
  const r = route();
  if (first) stop();
  for (const a of document.querySelectorAll("nav.tabs a")) a.classList.toggle("on", a.dataset.tab === r.tab);
  header();
  if (r.tab === "chat") {
    if (first) { chatFor = null; newBelow = false; view.innerHTML = `<div class="empty">Loading</div>`; loadChat(true); }
    floatButton();
    return;
  }
  chatToken++;
  float.hidden = true;
  if (r.tab === "walkie") {
    view.innerHTML = walkie(status);
    if (first) loadStatus();
  } else if (!app || app.error || !app.today) {
    view.innerHTML = `<div class="empty">${appFailed ? "Not reachable" : app && app.error ? "Watcher error: " + esc(app.error) : "Loading"}</div>`;
  } else {
    view.innerHTML = r.tab === "books" ? books(app) : summary(app);
    const more = document.getElementById("more");
    if (more) more.addEventListener("click", () => { allStruggles = true; render(false); });
    for (const el of view.querySelectorAll("details.cat")) {
      el.addEventListener("toggle", () => { if (el.open) openCats.add(el.dataset.cat); else openCats.delete(el.dataset.cat); });
    }
  }
  if (first) window.scrollTo(0, 0);
}
async function loadApp() {
  try {
    const res = await fetch("../app.json", {cache: "no-store"});
    if (!res.ok) throw new Error(String(res.status));
    app = await res.json();
    appFailed = false;
  } catch (e) {
    appFailed = true;
  }
  header();
  const r = route();
  if (r.tab === "summary" || r.tab === "books") render(false);
  if (r.tab === "chat") floatButton();
}
async function loadStatus() {
  try {
    const res = await fetch("../status.json", {cache: "no-store"});
    if (!res.ok) throw new Error(String(res.status));
    status = await res.json();
  } catch (e) {
    status = status || null;
  }
  if (route().tab === "walkie") view.innerHTML = walkie(status);
}
function live() {
  if (document.visibilityState !== "visible") return;
  const r = route();
  const today = app && app.today && app.today.date;
  if (r.tab === "chat" && (!r.date || r.date === today || (chat && chat.is_today && chat.date === r.date))) loadChat(false);
}

window.addEventListener("hashchange", () => render(true));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  loadApp();
  live();
  if (route().tab === "walkie") loadStatus();
});
setInterval(live, CHAT_POLL_MS);
setInterval(() => { if (document.visibilityState === "visible") loadApp(); }, 30000);
setInterval(() => { if (document.visibilityState === "visible" && route().tab === "walkie") loadStatus(); }, 30000);
setInterval(() => { for (const el of document.querySelectorAll("[data-ago]")) el.textContent = ago(el.dataset.ago); }, 30000);

/* Pull to refresh, from the top of a page (a home-screen app has no reload). */
let y0 = null, pulled = 0;
window.addEventListener("touchstart", e => { y0 = window.scrollY <= 0 ? e.touches[0].clientY : null; pulled = 0; }, {passive: true});
window.addEventListener("touchmove", e => {
  if (y0 == null) return;
  pulled = Math.max(0, e.touches[0].clientY - y0);
  ptr.style.height = `${Math.min(56, pulled / 2)}px`;
  ptr.classList.toggle("ready", pulled > 90);
}, {passive: true});
window.addEventListener("touchend", async () => {
  if (y0 == null) return;
  const go = pulled > 90;
  y0 = null;
  if (!go) { ptr.style.height = "0"; return; }
  ptr.classList.add("busy");
  await loadApp();
  const r = route();
  if (r.tab === "chat") await loadChat(false);
  if (r.tab === "walkie") await loadStatus();
  ptr.classList.remove("busy", "ready");
  ptr.style.height = "0";
});

if (window.isSecureContext && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
loadApp();
render(true);
</script>
</body>
