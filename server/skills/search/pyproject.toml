[project]
name = "huxley-skill-search"
version = "0.2.0"
description = "Web search for Huxley: ddgs metasearch with fallback, Google News headlines, page excerpts. Free, no API key."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Mario Ruiz", email = "marioalejandroruizsarmiento@gmail.com" }]
keywords = ["huxley", "voice-agent", "skill", "search", "ddgs", "google-news"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "huxley-sdk>=0.1.1,<0.2",
    "ddgs>=9.0",
    "httpx>=0.27",  # page excerpts + Google News headlines (BSD-3)
    "lxml>=5.0",  # page text extraction; already a ddgs dependency (BSD-3)
]

[project.entry-points."huxley.skills"]
search = "huxley_skill_search:SearchSkill"

[project.urls]
Homepage = "https://github.com/ma-r-s/Huxley"
Source = "https://github.com/ma-r-s/Huxley/tree/main/server/skills/search"
Issues = "https://github.com/ma-r-s/Huxley/issues"
Changelog = "https://github.com/ma-r-s/Huxley/blob/main/server/skills/search/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huxley_skill_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
