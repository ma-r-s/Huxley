[project]
name = "huxley-skill-spotify"
version = "0.1.0"
description = "Spotify for Huxley: plays a household Premium account through Spotify Soloist, streamed like radio."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Mario Ruiz", email = "marioalejandroruizsarmiento@gmail.com" }]
keywords = ["huxley", "voice-agent", "skill", "spotify", "soloist", "music"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "huxley-sdk>=0.1.1,<0.2",
    "httpx>=0.27",
    "websockets>=14.0",
    # The shelf build reads persona.yaml and shelf.yaml (T1.45).
    "pyyaml>=6.0",
]

[project.scripts]
huxley-spotify-shelf = "huxley_skill_spotify.shelf_build:main"

[project.entry-points."huxley.skills"]
spotify = "huxley_skill_spotify:SpotifySkill"

[project.urls]
Homepage = "https://github.com/ma-r-s/Huxley"
Source = "https://github.com/ma-r-s/Huxley/tree/main/server/skills/spotify"
Issues = "https://github.com/ma-r-s/Huxley/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huxley_skill_spotify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
