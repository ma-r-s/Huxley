[project]
name = "huxcase"
version = "0.1.0"
description = "Parametric enclosure concepts for the Huxley walkie-talkie client (Waveshare ESP32-S3-AUDIO-Board)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "build123d>=0.9",
    "trimesh>=5.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
